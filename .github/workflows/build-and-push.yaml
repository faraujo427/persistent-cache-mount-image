name: Build and publish

on:
  push:
    branches: ['main']

env:
  IMAGE_NAME: ghcr.io/${{ github.actor }}/persistent-cache-mount

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCI repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sets metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache

      - name: Generate image attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Expose variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env['ACTIONS_CACHE_SERVICE_V2'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Test image
        run: |
          docker build \
          --build-arg GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
          --build-arg ACTIONS_CACHE_URL="$ACTIONS_CACHE_URL" \
          --build-arg ACTIONS_CACHE_SERVICE_V2="$ACTIONS_CACHE_SERVICE_V2" \
          --build-arg ACTIONS_RESULTS_URL="$ACTIONS_RESULTS_URL" \
          --build-arg ACTIONS_RUNTIME_TOKEN="$ACTIONS_RUNTIME_TOKEN" \
          __tests__/image \
          2>&1 | sed -nE '/#[[:digit:]]+ [[:digit:]]+\.[[:digit:]]+ /{s/#[[:digit:]]+ [[:digit:]]+\.[[:digit:]]+ //;p}'
