name: Build and publish

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.actor }}/persistent-cache-mount

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCI repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sets metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache

      - name: Generate image attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Expose cacheurl
        id: cache-url
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: return process.env['ACTIONS_CACHE_URL']
      - name: Expose cache service
        id: cache-service-v2
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: return process.env['ACTIONS_CACHE_SERVICE_V2']
      - name: Expose result url
        id: result-url
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: return process.env['ACTIONS_RESULTS_URL']
      - name: Expose runtime token
        id: runtime-token
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: return process.env['ACTIONS_RUNTIME_TOKEN']

      - name: Test image
        uses: docker/build-push-action@v7
        with:
          context: __tests__/image
          build-args: |
            GITHUB_SERVER_URL=https://github.com
            ACTIONS_CACHE_URL=${{ steps.cache-url.outputs.result }}
            ACTIONS_CACHE_SERVICE_V2=${{ steps.cache-service-v2.outputs.result }}
            ACTIONS_RESULTS_URL=${{ steps.result-url.outputs.result }}
            ACTIONS_RUNTIME_TOKEN=${{ steps.runtime-token.outputs.result }}
