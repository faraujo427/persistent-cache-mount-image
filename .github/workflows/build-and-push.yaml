name: Build and publish

on:
  push:
    branches: ['main']

env:
  IMAGE_NAME: ghcr.io/${{ github.actor }}/persistent-cache-mount

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      CACHE_KEY: test-key
    permissions:
      actions: write
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCI repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sets metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Expose variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env['ACTIONS_CACHE_SERVICE_V2'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Test image
        run: |
          set -eou pipefail
          docker build \
          --build-arg CACHE_KEY=${{ env.CACHE_KEY }} \
          --secret id=GITHUB_SERVER_URL,env=GITHUB_SERVER_URL \
          --secret id=ACTIONS_CACHE_URL,env=ACTIONS_CACHE_URL \
          --secret id=ACTIONS_CACHE_SERVICE_V2,env=ACTIONS_CACHE_SERVICE_V2 \
          --secret id=ACTIONS_RESULTS_URL,env=ACTIONS_RESULTS_URL \
          --secret id=ACTIONS_RUNTIME_TOKEN,env=ACTIONS_RUNTIME_TOKEN \
          __tests__/image \
          2>&1 | sed -nE '/#[[:digit:]]+ [[:digit:]]+\.[[:digit:]]+ /{s/#[[:digit:]]+ [[:digit:]]+\.[[:digit:]]+ //;p}'

      - name: Clean image test
        uses: actions/github-script@v9
        with:
          script: |
            octokit.rest.actions.deleteActionsCacheByKey({
              "owner": "${{ github.repository_owner }}",
              "repo": "persistent-cache-mount-image",
              "key": "${{ env.CACHE_KEY }}",
            });

      - name: Push the image
        id: push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generate image attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
